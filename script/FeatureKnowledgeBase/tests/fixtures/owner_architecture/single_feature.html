<!doctype html>
<html><head><title>ABS</title></head><body><main>
  <h1 id="function_abs">ABS(X)</h1>
  <h2>Syntax</h2><code>ABS(X)</code>
  <h2>Description</h2><p>Returns the absolute value of <code>X</code>.</p>
  <p>If the argument is NULL, the result is NULL.</p>
  <h2>Examples</h2><pre>SELECT ABS(-32);</pre>
</main></body></html>

<h1><a name="bit-type"></a>Bit-Value Type - BIT</h1>
<p>The <code>BIT</code> data type stores bit values. <code>BIT(<em>M</em>)</code> enables storage of M-bit values. M can range from 1 to 64.</p>
</section></main></body></html>

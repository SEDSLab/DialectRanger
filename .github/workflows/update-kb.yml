name: Update All Feature KBs

on:
  workflow_dispatch:
  schedule:
    # Sunday 02:17 Asia/Shanghai (UTC+8).
    - cron: '17 18 * * 6'

permissions:
  contents: read

concurrency:
  group: feature-kb-update
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      databases: ${{ steps.plan.outputs.databases }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r script/FeatureKnowledgeBase/requirements.txt pytest
      - name: Offline regression
        working-directory: script/FeatureKnowledgeBase
        run: >-
          python -m pytest tests/test_dialectranger_integration.py tests/test_ci_update.py
          tests/test_ci_update_all.py tests/test_profile_identity_type_precedence.py
          tests/test_current_pipeline_smoke.py tests/test_explicit_document_input.py
          tests/test_minimal_unified_build_integration.py tests/test_release_preflight.py -q
      - id: plan
        run: python script/FeatureKnowledgeBase/ci_update_all.py plan

  crawl:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        dbms: ${{ fromJSON(needs.plan.outputs.databases) }}
    env:
      FEATURE_CRAWLER_HTTP_TRUST_ENV: '0'
      PYTHONUNBUFFERED: '1'
      PYTHONUTF8: '1'
      DBMS: ${{ matrix.dbms }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r script/FeatureKnowledgeBase/requirements.txt
      - name: Build and validate one DB (no publication here)
        run: python script/FeatureKnowledgeBase/ci_update_all.py worker --dbms "$DBMS"
      - name: Upload isolated result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-update-${{ matrix.dbms }}
          path: script/FeatureKnowledgeBase/.runtime/ci/results/
          retention-days: 7
          if-no-files-found: warn

  publish:
    needs: [plan, crawl]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r script/FeatureKnowledgeBase/requirements.txt
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: feature-update-*
          path: script/FeatureKnowledgeBase/.runtime/collected
          merge-multiple: true
      - name: Keep failed DB baselines, collect valid results, export once
        run: python script/FeatureKnowledgeBase/ci_update_all.py collect --artifact-root script/FeatureKnowledgeBase/.runtime/collected
      - name: Submit and deploy once
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git add data/FeatureKnowledgeBase web/js/data.js web/index.html
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: refresh registered official Feature KBs'
            git push origin "HEAD:$BASE_BRANCH"
          fi
          gh workflow run deploy-pages.yml --ref "$BASE_BRANCH"
      - name: Publish per-DB outcome summary
        if: always()
        shell: bash
        run: |
          if [ -f script/FeatureKnowledgeBase/.runtime/ci/all_update_summary.json ]; then
            echo '## Per-database update results' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat script/FeatureKnowledgeBase/.runtime/ci/all_update_summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feature-update-summary
          path: script/FeatureKnowledgeBase/.runtime/ci/all_update_summary.json
          retention-days: 7
          if-no-files-found: ignore
